<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>内容管理 · YJ-MoLi</title><link rel="stylesheet" href="admin.css"></head><body>
<header><a href="/">YJ-MoLi</a><strong>内容管理</strong><button id="connect">连接 GitHub</button><button id="export">导出草稿</button><label class="button">导入<input type="file" id="import" accept="application/json" hidden></label><button id="preview">预览</button><button id="publish" class="primary">发布</button></header>
<p id="status" role="status">正在加载…</p><main><aside><nav id="nav"></nav><label>阶段<select id="filter"><option value="">全部</option><option value="undergraduate">本科（含后续）</option><option value="graduate">硕士</option></select></label><input id="search" placeholder="搜索标题" aria-label="搜索标题"><button id="add">＋ 新增记录</button><div id="list"></div></aside><section><form id="editor"><p>选择左侧记录开始编辑。</p></form></section></main>
<dialog id="auth"><form method="dialog"><h2>连接 GitHub</h2><p>创建仅限本仓库的 fine-grained token，授予 Contents：Read and write。</p><p><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">打开 GitHub 令牌设置 ↗</a></p><label>访问令牌<input id="token" type="password" autocomplete="off"></label><p>令牌仅保存在当前页面内存，刷新后需重新连接。不要在共享设备上保留草稿。</p><button value="cancel">取消</button><button id="login" type="button" class="primary">连接</button></form></dialog>
<dialog id="preview-dialog"><button id="close-preview">关闭预览</button><select id="preview-page" aria-label="预览页面"></select><iframe sandbox="" title="网站预览"></iframe></dialog>
<script type="module" src="app.mjs"></script></body></html>
